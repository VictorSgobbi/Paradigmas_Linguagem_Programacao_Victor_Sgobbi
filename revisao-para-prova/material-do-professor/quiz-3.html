 montadas manualmente. Funções como getChar, addChar e lookup apoiam o reconhecimento.","Basta memorizar o nome do conceito; contexto, objetivos e consequências não alteram sua análise.","O conceito pode ser relacionado aos objetivos e a exemplos da aula.","Uma explicação adequada distingue o conceito de ideias próximas."],"prompt":"Sobre “Implementação do analisador léxico”, é errado afirmar que:"},{"correctIndex":2,"feedback":"Objetivos da análise sintática: O parser deve localizar erros sintáticos, produzir diagnósticos, recuperar-se para continuar a análise e construir a árvore de análise sintática ou um caminho correspondente. Objetivos relacionados: Explicar a cooperação entre análise léxica e análise sintática no processamento de linguagens.; Comparar análise sintática descendente e ascendente, incluindo lookahead, recursão à esquerda e redução.","id":"question-c35","objectiveLabels":["Explicar a cooperação entre análise léxica e análise sintática no processamento de linguagens.","Comparar análise sintática descendente e ascendente, incluindo lookahead, recursão à esquerda e redução."],"options":["Misturar conceitos diferentes e observar apenas a conclusão final.","Escolher um exemplo sem explicar sua relação com o conceito.","Definir Objetivos da análise sintática, aplicá-lo a um exemplo e justificar a análise: O parser deve localizar erros sintáticos, produzir diagnósticos, recuperar-se para continuar a análise e construir a árvore de análise sintática ou um caminho correspondente.","Memorizar a definição e dispensar exemplos ou justificativas."],"prompt":"Qual procedimento demonstra melhor a compreensão de “Objetivos da análise sintática”?"},{"correctIndex":3,"feedback":"No cenário apresentado, o conceito central é Análise Sintática Descendente. A análise descendente constrói a árvore a partir da raiz, usa derivação mais à esquerda e pode ser implementada por uma coleção de subprogramas, muitos deles recursivos.","id":"question-c36","objectiveLabels":["Comparar análise sintática descendente e ascendente, incluindo lookahead, recursão à esquerda e redução."],"options":["Razões para estudar conceitos de LP","Critérios de Avaliação de Linguagem","Legibilidade e ortogonalidade","Análise Sintática Descendente"],"prompt":"Em uma atividade de aplicação, qual conceito corresponde a esta descrição: “A análise descendente constrói a árvore a partir da raiz, usa derivação mais à esquerda e pode ser implementada por uma coleção de subprogramas, muitos deles recursivos.”?"},{"correctIndex":0,"feedback":"Lookahead: Quando um não terminal possui alternativas, o analisador descendente compara o próximo token com os primeiros tokens que cada regra pode gerar. A ausência de correspondência indica erro sintático. Objetivos relacionados: Comparar análise sintática descendente e ascendente, incluindo lookahead, recursão à esquerda e redução.","id":"question-c37","objectiveLabels":["Comparar análise sintática descendente e ascendente, incluindo lookahead, recursão à esquerda e redução."],"options":["Quando um não terminal possui alternativas, o analisador descendente compara o próximo token com os primeiros tokens que cada regra pode gerar. A ausência de correspondência indica erro sintático.","O estudo dos conceitos de linguagens de programação amplia a expressão de ideias, fundamenta a escolha de linguagens, facilita a aprendizagem de novas linguagens, melhora o uso das já conhecidas e ajuda a compreender a implementação.","Legibilidade, capacidade de escrita, confiabilidade e custo são critérios usados para comparar a adequação de uma linguagem, sem pressupor que uma única linguagem maximize todos eles.","Legibilidade envolve a facilidade de compreender programas. A ortogonalidade contribui para ela ao permitir que componentes básicos sejam combinados com poucas restrições e exceções."],"prompt":"Qual opção descreve melhor “Lookahead”?"},{"correctIndex":1,"feedback":"Recursão à esquerda: Gramáticas com recursão à esquerda direta ou ind   <script>
    const data = JSON.parse(document.getElementById("quiz-data").textContent);
    const form = document.getElementById("quiz");
    data.questions.forEach((question, questionIndex) => {
      const section = document.createElement("section");
      section.className = "question";
      const title = document.createElement("h2");
      title.textContent = `${questionIndex + 1}. ${question.prompt}`;
      section.appendChild(title);
      const objective = document.createElement("p");
      objective.className = "objective";
      objective.textContent = `Objetivos: ${question.objectiveLabels.join(" ")}`;
      section.appendChild(objective);
      question.options.forEach((option, optionIndex) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = question.id;
        input.value = optionIndex;
        label.append(input, ` ${option}`);
        section.appendChild(label);
      });
      const feedback = document.createElement("p");
      feedback.className = "feedback";
      feedback.hidden = true;
      feedback.dataset.for = question.id;
      section.appendChild(feedback);
      form.appendChild(section);
    });
    document.getElementById("check").addEventListener("click", () => {
      let score = 0;
      data.questions.forEach((question) => {
        const selected = form.querySelector(`input[name="${question.id}"]:checked`);
        const correct = selected && Number(selected.value) === question.correctIndex;
        if (correct) score += 1;
        form.querySelectorAll(`input[name="${question.id}"]`).forEach(
          (input, optionIndex) => {
            const label = input.closest("label");
            label.classList.toggle(
              "answer-correct",
              optionIndex === question.correctIndex
            );
            label.classList.toggle(
              "answer-incorrect",
              input.checked && optionIndex !== question.correctIndex
            );
          }
        );
        const feedback = form.querySelector(`[data-for="${question.id}"]`);
        feedback.hidden = false;
        feedback.textContent = `${correct ? "Correto." : "Revise."} ${question.feedback}`;
      });
      document.getElementById("score").textContent =
        `Resultado: ${score} de ${data.questions.length}.`;
    });
  </script>
