  <script>
    const data = JSON.parse(document.getElementById("quiz-data").textContent);
    const form = document.getElementById("quiz");
    data.questions.forEach((question, questionIndex) => {
      const section = document.createElement("section");
      section.className = "question";
      const title = document.createElement("h2");
      title.textContent = `${questionIndex + 1}. ${question.prompt}`;
      section.appendChild(title);
      const objective = document.createElement("p");
      objective.className = "objective";
      objective.textContent = `Objetivos: ${question.objectiveLabels.join(" ")}`;
      section.appendChild(objective);
      question.options.forEach((option, optionIndex) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = question.id;
        input.value = optionIndex;
        label.append(input, ` ${option}`);
        section.appendChild(label);
      });
      const feedback = document.createElement("p");
      feedback.className = "feedback";
      feedback.hidden = true;
      feedback.dataset.for = question.id;
      section.appendChild(feedback);
      form.appendChild(section);
    });
    document.getElementById("check").addEventListener("click", () => {
      let score = 0;
      data.questions.forEach((question) => {
        const selected = form.querySelector(`input[name="${question.id}"]:checked`);
        const correct = selected && Number(selected.value) === question.correctIndex;
        if (correct) score += 1;
        form.querySelectorAll(`input[name="${question.id}"]`).forEach(
          (input, optionIndex) => {
            const label = input.closest("label");
            label.classList.toggle(
              "answer-correct",
              optionIndex === question.correctIndex
            );
            label.classList.toggle(
              "answer-incorrect",
              input.checked && optionIndex !== question.correctIndex
            );
          }
        );
        const feedback = form.querySelector(`[data-for="${question.id}"]`);
        feedback.hidden = false;
        feedback.textContent = `${correct ? "Correto." : "Revise."} ${question.feedback}`;
      });
      document.getElementById("score").textContent =
        `Resultado: ${score} de ${data.questions.length}.`;
    });
  </script>
