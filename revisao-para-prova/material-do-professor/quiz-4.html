plícito. Elas diferem pelo momento e mecanismo de alocação, flexibilidade, eficiência, suporte à recursão e possibilidade de detecção de erros. Objetivos relacionados: Caracterizar nomes, variáveis, vinculações, alocação e tempo de vida.; Relacionar decisões de projeto, evolução histórica, descrição formal, processamento e comportamento de variáveis entre os capítulos 1 a 5.","id":"question-c48","objectiveLabels":["Caracterizar nomes, variáveis, vinculações, alocação e tempo de vida.","Relacionar decisões de projeto, evolução histórica, descrição formal, processamento e comportamento de variáveis entre os capítulos 1 a 5."],"options":["Misturar conceitos diferentes e observar apenas a conclusão final.","Definir Categorias de variáveis por tempo de vida, aplicá-lo a um exemplo e justificar a análise: As categorias apresentadas são estáticas, dinâmicas da pilha, dinâmicas de heap e dinâmicas de heap implícito. Elas diferem pelo momento e mecanismo de alocação, flexibilidade, eficiência, suporte à recursão e possibilidade de detecção de erros.","Escolher um exemplo sem explicar sua relação com o conceito.","Memorizar a definição e dispensar exemplos ou justificativas."],"prompt":"Qual procedimento demonstra melhor a compreensão de “Categorias de variáveis por tempo de vida”?"},{"correctIndex":2,"feedback":"No cenário apresentado, o conceito central é Escopo estático, escopo dinâmico e ambiente de referenciamento. Escopo é a faixa de sentenças em que uma variável é visível. No escopo estático, a declaração é encontrada pela organização textual e pelos ancestrais estáticos; no dinâmico, pela sequência de chamadas. O ambiente de referenciamento reúne as variáveis visíveis em uma sentença.","id":"question-c49","objectiveLabels":["Comparar escopo estático, escopo dinâmico, ambiente de referenciamento e constantes nomeadas.","Relacionar decisões de projeto, evolução histórica, descrição formal, processamento e comportamento de variáveis entre os capítulos 1 a 5."],"options": ada recebe uma única vinculação de valor e favorece legibilidade, modificabilidade e parametrização."],"prompt":"Qual opção descreve melhor “Escopo, tempo de vida e constantes nomeadas”?"}],"title":"Revisão da Primeira Prova Bimestral — Quiz 4 de 4"}</script>
  <script>
    const data = JSON.parse(document.getElementById("quiz-data").textContent);
    const form = document.getElementById("quiz");
    data.questions.forEach((question, questionIndex) => {
      const section = document.createElement("section");
      section.className = "question";
      const title = document.createElement("h2");
      title.textContent = `${questionIndex + 1}. ${question.prompt}`;
      section.appendChild(title);
      const objective = document.createElement("p");
      objective.className = "objective";
      objective.textContent = `Objetivos: ${question.objectiveLabels.join(" ")}`;
      section.appendChild(objective);
      question.options.forEach((option, optionIndex) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = question.id;
        input.value = optionIndex;
        label.append(input, ` ${option}`);
        section.appendChild(label);
      });
      const feedback = document.createElement("p");
      feedback.className = "feedback";
      feedback.hidden = true;
      feedback.dataset.for = question.id;
      section.appendChild(feedback);
      form.appendChild(section);
    });
    document.getElementById("check").addEventListener("click", () => {
      let score = 0;
      data.questions.forEach((question) => {
        const selected = form.querySelector(`input[name="${question.id}"]:checked`);
        const correct = selected && Number(selected.value) === question.correctIndex;
        if (correct) score += 1;
        form.querySelectorAll(`input[name="${question.id}"]`).forEach(
          (input, optionIndex) => {
            const label = input.closest("label");
            label.classList.toggle(
              "answer-correct",
              optionIndex === question.correctIndex
            );
            label.classList.toggle(
              "answer-incorrect",
              input.checked && optionIndex !== question.correctIndex
            );
          }
        );
        const feedback = form.querySelector(`[data-for="${question.id}"]`);
        feedback.hidden = false;
        feedback.textContent = `${correct ? "Correto." : "Revise."} ${question.feedback}`;
      });
      document.getElementById("score").textContent =
        `Resultado: ${score} de ${data.questions.length}.`;
    });
  </script>
