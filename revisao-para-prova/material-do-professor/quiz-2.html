  <script id="quiz-data" type="application/json">{"questions":[{"correctIndex":3,"feedback":"Fortran e computação científica: A evolução de Fortran incorporou recursos como declarações de tipo explícitas, estruturas de controle, passagem de subprogramas, vetores dinâmicos, registros, ponteiros, módulos e recursão, acompanhando novas necessidades de programação científica. Objetivos relacionados: Analisar a evolução das principais linguagens de programação considerando contexto histórico, domínio e contribuições.; Comparar linguagens e famílias dos paradigmas imperativo, funcional, lógico, orientado a objetos, scripting e híbrido de marcação-programação.","id":"question-c14","objectiveLabels":["Analisar a evolução das principais linguagens de programação considerando contexto histórico, domínio e contribuições.","Comparar linguagens e famílias dos paradigmas imperativo, funcional, lógico, orientado a objetos, scripting e híbrido de marcação-programação."],"options":["O estudo dos conceitos de linguagens de programação amplia a expressão de ideias, fundamenta a escolha de linguagens, facilita a aprendizagem de novas linguagens, melhora o uso das já conhecidas e ajuda a compreender a implementação.","Legibilidade, capacidade de escrita, confiabilidade e custo são critérios usados para comparar a adequação de uma linguagem, sem pressupor que uma única linguagem maximize todos eles.","Legibilidade envolve a facilidade de compreender programas. A ortogonalidade contribui para ela ao permitir que componentes básicos sejam combinados com poucas restrições e exceções.","A evolução de Fortran incorporou recursos como declarações de tipo explícitas, estruturas de controle, passagem de subprogramas, vetores dinâmicos, registros, ponteiros, módulos e recursão, acompanhando novas necessidades de programação científica."],"prompt":"Qual opção descreve melhor “Fortran e computação científica”?"},{"correctIndex":0,"feedback":"Lisp, Scheme e programação funcional: A linhagem de Lisp entos capazes de especificar ações como controle de fluxo e computação. XSLT e JSP aparecem como exemplos históricos dessa categoria. Objetivos relacionados: Analisar a evolução das principais linguagens de programação considerando contexto histórico, domínio e contribuições.; Comparar linguagens e famílias dos paradigmas imperativo, funcional, lógico, orientado a objetos, scripting e híbrido de marcação-programação.","id":"question-c20","objectiveLabels":["Analisar a evolução das principais linguagens de programação considerando contexto histórico, domínio e contribuições.","Comparar linguagens e famílias dos paradigmas imperativo, funcional, lógico, orientado a objetos, scripting e híbrido de marcação-programação."],"options":["Desconsiderar o contexto e repetir somente uma palavra da definição.","Relacionar Linguagens híbridas de marcação-programação às consequências observáveis, pois a síntese registra: Uma linguagem híbrida de marcação-programação estende marcação com elementos capazes de especificar ações como controle de fluxo e computação. XSLT e JSP aparecem como exemplos históricos dessa categoria.","Substituir o conceito por qualquer outro sem comparar seus significados.","Usar o nome do conceito como resposta sem explicar suas consequências."],"prompt":"Ao analisar um exemplo da aula, como “Linguagens híbridas de marcação-programação” deve orientar a explicação?"},{"correctIndex":2,"feedback":"A afirmação errada reduz Sintaxe e Semântica a memorização. Na aula, a síntese registra: Sintaxe é a forma ou estrutura das expressões, atribuições e unidades de programa; semântica é o significado dessas construções. Juntas, caracterizam a definição de uma linguagem de programação.","id":"question-c21","objectiveLabels":["Distinguir sintaxe, semântica, sentença, linguagem, lexema e token.","Relacionar decisões de projeto, evolução histórica, descrição formal, processamento e comportamento de variáveis entre os capítulos 1 a 5."],"options":["Sintaxe é a forma ou estrutura das expressões, atribuições e unidades de programa; semântica é o significado dessas construções. Juntas, caracterizam a definição de uma linguagem de programação.","O conceito pode ser relacionado aos objetivos e a exemplos da aula.","Basta memorizar o nome do conceito; contexto, objetivos e consequências não alteram sua análise.","Uma explicação adequada distingue o conceito de ideias próximas."],"prompt":"Sobre “Sintaxe e Semântica”, é errado afirmar que:"},{"correctIndex":3,"feedback":"Sentença, linguagem, lexema e token: Sentença é uma cadeia de caracteres sobre um alfabeto; linguagem é um conjunto de sentenças; lexema é uma unidade sintática elementar; e token é uma categoria que reúne lexemas. Objetivos relacionados: Distinguir sintaxe, semântica, sentença, linguagem, lexema e token.; Explicar a cooperação entre análise léxica e análise sintática no processamento de linguagens.","id":"question-c22","objectiveLabels":["Distinguir sintaxe, semântica, sentença, linguagem, lexema e token.","Explicar a cooperação entre análise léxica e análise sintática no processamento de linguagens."],"options":["Misturar conceitos diferentes e observar apenas a conclusão final.","Escolher um exemplo sem explicar sua relação com o conceito.","Memorizar a definição e dispensar exemplos ou justificativas.","Definir Sentença, linguagem, lexema e token, aplicá-lo a um exemplo e justificar a análise: Sentença é uma cadeia de caracteres sobre um alfabeto; linguagem é um conjunto de sentenças; lexema é uma unidade sintática elementar; e token é uma categoria que reúne lexemas."],"prompt":"Qual procedimento demonstra melhor a compreensão de “Sentença, linguagem, lexema e token”?"},{"correctIndex":0,"feedback":"No cenário apresentado, o conceito central é Reconhecedores e Geradores. Um reconhecedor decide se uma cadeia pertence à linguagem. Um gerador descreve ou produz as sentenças da linguagem e oferece uma estrutura com a qual uma sentença pode ser comparada.","id":"question-c23","objectiveLabels":["Distinguir sintaxe, semântica, sentença, linguagem, lexema e token.","Aplicar FNB, FNBE, gramáticas livres de contexto, derivações e árvores de análise sintática.","Explicar a cooperação entre análise léxica e análise sintática no processamento de linguagens."],"options":["Reconhecedores e Geradores","Razões para estudar conceitos de LP","Critérios de Avaliação de Linguagem","Legibilidade e ortogonalidade"],"prompt":"Em uma revisão dos conceitos, qual conceito corresponde a esta descrição: “Um reconhecedor decide se uma cadeia pertence à linguagem. Um gerador descreve ou produz as sentenças da linguagem e oferece uma estrutura com a qual uma sentença pode ser comparada.”?"},{"correctIndex":1,"feedback":"FNB e Gramáticas Livres de Contexto: Gramáticas Livres de Contexto são geradores usados para descrever classes de linguagens. A Forma Normal de Backus foi criada para descrever a sintaxe de Algol 58 e é equivalente às gramáticas livres de contexto. Objetivos relacionados: Aplicar FNB, FNBE, gramáticas livres de contexto, derivações e árvores de análise sintática.","id":"question-c24","objectiveLabels":["Aplicar FNB, FNBE, gramáticas livres de contexto, derivações e árvores de análise sintática."],"options":["O estudo dos conceitos de linguagens de programação amplia a expressão de ideias, fundamenta a escolha de linguagens, facilita a aprendizagem de novas linguagens, melhora o uso das já conhecidas e ajuda a compreender a implementação.","Gramáticas Livres de Contexto são geradores usados para descrever classes de linguagens. A Forma Normal de Backus foi criada para descrever a sintaxe de Algol 58 e é equivalente às gramáticas livres de contexto.","Legibilidade, capacidade de escrita, confiabilidade e custo são critérios usados para comparar a adequação de uma linguagem, sem pressupor que uma única linguagem maximize todos eles.","Legibilidade envolve a facilidade de compreender programas. A ortogonalidade contribui para ela ao permitir que c   <script>
    const data = JSON.parse(document.getElementById("quiz-data").textContent);
    const form = document.getElementById("quiz");
    data.questions.forEach((question, questionIndex) => {
      const section = document.createElement("section");
      section.className = "question";
      const title = document.createElement("h2");
      title.textContent = `${questionIndex + 1}. ${question.prompt}`;
      section.appendChild(title);
      const objective = document.createElement("p");
      objective.className = "objective";
      objective.textContent = `Objetivos: ${question.objectiveLabels.join(" ")}`;
      section.appendChild(objective);
      question.options.forEach((option, optionIndex) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = question.id;
        input.value = optionIndex;
        label.append(input, ` ${option}`);
        section.appendChild(label);
      });
      const feedback = document.createElement("p");
      feedback.className = "feedback";
      feedback.hidden = true;
      feedback.dataset.for = question.id;
      section.appendChild(feedback);
      form.appendChild(section);
    });
    document.getElementById("check").addEventListener("click", () => {
      let score = 0;
      data.questions.forEach((question) => {
        const selected = form.querySelector(`input[name="${question.id}"]:checked`);
        const correct = selected && Number(selected.value) === question.correctIndex;
        if (correct) score += 1;
        form.querySelectorAll(`input[name="${question.id}"]`).forEach(
          (input, optionIndex) => {
            const label = input.closest("label");
            label.classList.toggle(
              "answer-correct",
              optionIndex === question.correctIndex
            );
            label.classList.toggle(
              "answer-incorrect",
              input.checked && optionIndex !== question.correctIndex
            );
          }
        );
        const feedback = form.querySelector(`[data-for="${question.id}"]`);
        feedback.hidden = false;
        feedback.textContent = `${correct ? "Correto." : "Revise."} ${question.feedback}`;
      });
      document.getElementById("score").textContent =
        `Resultado: ${score} de ${data.questions.length}.`;
    });
  </script>
</body>
